# Damiao DM-J4310-2EC motor configuration
# All positions in radians (output shaft).
# Velocity in rad/s, acceleration in rad/s², torque in N·m.

[defaults]
# optional – ROS2 node name; also used as the topic namespace prefix
node_name                   = "grippers"
# required – host CAN ID; must match MST_ID register on all motors
master_id                   = 23      # 0x17 — read from motor's MST_ID register
# required – CAN interface name
channel                      = "can0"   # fallback — each motor overrides this
# required – python-can bus type
bustype                     = "socketcan"
# required – must match motor firmware (1 Mbps for DM-J43xx)
bitrate                     = 1000000
# required – parameter read reply timeout (s)
rx_timeout                  = 0.05
# required – JointState publish rate (Hz)
update_rate_hz              = 50.0
# optional – default control mode for all motors unless overridden per-motor
#            MIT | POSITION_VELOCITY | VELOCITY | FORCE_POSITION_HYBRID
operation_mode              = "FORCE_POSITION_HYBRID"

[AgL]
# required
type                = "J4310_2EC"
# required – motor ESC_ID register value; must be 0–15
motor_id            = 7      # ESC_ID — confirmed by find_damiao_motors.py
# optional – overrides defaults.operation_mode for this motor only
# operation_mode    = "MIT"
# optional – overrides defaults.channel / bustype / bitrate / master_id / rx_timeout
channel           = "can6"
# master_id         = 0

# optional – software joint limits (rad); commands outside range are rejected
joint_limit_min     = 0.02
joint_limit_max     =  5.05
# optional – default current cap for force_position_hybrid mode (0.0–1.0 fraction of Imax)
current_per_unit    = 0.25
# optional – subtracted from raw motor position to give user-frame position (rad)
#motor_homing_pos    =  0.0
# optional – velocity command clamp (rad/s); no clamp if absent
max_vel             =  30.0
# optional – acceleration clamp applied to action server goals (rad/s²); no clamp if absent
#max_accel           =  5.0
# optional – deceleration clamp (rad/s²); stored but not yet applied in commands
#max_decel           =  5.0

# optional – motion profile registers written to motor at startup; skipped if absent
#acc                 =  5.0       # ACC  (0x04) – acceleration ramp rad/s²
#dec                 =  5.0       # DEC  (0x05) – deceleration magnitude rad/s² (written as negative)
#max_spd             =  10.0      # MAX_SPD (0x06) – velocity cap rad/s

# optional – control gain registers written to motor at startup; skipped if absent
#kp_apr              =  20.0      # KP_APR (0x1B) – position loop Kp
#ki_apr              =  0.1       # KI_APR (0x1C) – position loop Ki
#kp_asr              =  0.5       # KP_ASR (0x19) – velocity loop Kp
#ki_asr              =  0.01      # KI_ASR (0x1A) – velocity loop Ki

# optional – MIT mode gains applied per-command (not written to registers); default 0.0 if absent
#kp                  =  30.0      # position proportional gain [0, 500]
#kd                  =  0.5       # velocity derivative gain   [0, 5]

[AgR]
type = "J4310_2EC"
motor_id = 7
channel = "can4"
joint_limit_min     = 0.02
joint_limit_max     = 5.05
max_vel             = 30.0
current_per_unit    = 0.25