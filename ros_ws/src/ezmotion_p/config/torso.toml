# ezmotion_p — motor node config

[defaults]
node_name                = "torso"
channel                  = "can5"
bustype                  = "socketcan"
bitrate                  = 1000000
rx_timeout               = 0.1        # SDO reply timeout (s)
update_rate_hz           = 50.0       # joint_states publish rate (Hz)
active_report_hz         = 50.0       # TPDO event timer rate (Hz); 0 = disabled
operation_mode           = "PP"       # default DS402 mode: PP PV PT HM CSP CSV CST

[torso]
type                 = "MMS760400_48_C2_1"
node_id              = 9
# operation_mode     = "CSP"     # per-motor override (optional)
joint_limit_min      = -6.2832   # rad  (-2π)
joint_limit_max      =  6.2832   # rad  (+2π)
profile_velocity     =  100.0      # rad/s  written to 6081h at startup
profile_acceleration = 100.0      # rad/s² written to 6083h at startup
profile_deceleration = 100.0      # rad/s² written to 6084h at startup
max_torque           = 3.81      # N·m   peak output torque (3000‰ rated) — written to 6072h at startup

# Linear actuator height limits — used by go_to and safe_vel topics
top_height_mm    = 600.0   # mm — maximum height (hard stop / homing position)
bottom_height_mm =  50.0   # mm — minimum height
homing_height_mm = 600.0   # mm — physical height at motor position 0 (after homing)

# Homing parameters (DS402 homing mode)
homing_method             = -3     # -3 = HOME_USING_MAX_TORQUE_UP (torque hard-stop)
homing_max_torque_permil = 500   # 100% rated torque — written to 2070h sub1
homing_speed_rps          = 1.0    # rad/s — written to 6099h sub1 and sub2
homing_acceleration_rps2  = 50.0   # rad/s² — written to 609Ah
homing_offset_rotations   = 1.0    # rotations offset from hard stop — written to 607Ch
homing_timeout            = 60.0   # seconds to wait for homing-attained (statusword bit 12)
