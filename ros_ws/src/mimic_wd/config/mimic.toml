# mimic node — unified config
# target_node controls which arm receives commands (the other becomes source).
# Switch at runtime: ros2 service call /mimic_node/switch_target \
#   custom_interfaces/srv/SetMimicTarget "{target: 'left_arm'}"

urdf_prefix          = "mimic_wd"              # ROS package containing the URDFs
left_arm_urdf_path   = "urdf/left_arm/feather_arm_left_8dof.urdf"
right_arm_urdf_path  = "urdf/right_arm/feather_arm_right_8dof.urdf"
left_ee_frame        = "left_gripper"               # end-effector frame name in the left arm URDF
right_ee_frame       = "right_gripper"              # end-effector frame name in the right arm URDF
base_frame           = "torso_lift_link"             # base frame shared by both arms

use_ik           = false          # true → FK→mirror→IK pipeline; false → direct joint mirroring
robstride_mode   = "operation"
damiao_mode      = "position_velocity"   # mit | position_velocity | velocity
debug            = false
visualize_rviz   = false  # publish EE axes as RViz markers for source and target arm
active_report_hz = 30.0
ik_hz         = 30.0  # Hz — rate at which the state snapshot dict is built

left_arm_node_prefix  = "/left_arm"
right_arm_node_prefix = "/right_arm"

left_gripper_node_prefix  = "/grippers"
right_gripper_node_prefix = "/grippers"

# "right_arm" → left arm is source, right arm follows
# "left_arm"  → right arm is source, left arm follows
target_node = "right_arm"

# Base motor names — L/R suffix is appended automatically based on direction
robstride_motors = ["Sp", "Sr", "Sw", "Ep", "Ww", "Wp", "Wr"]
damiao_motors    = ["Ag"]

[robstride_operation_defaults]
velocity  = 0.0   # rad/s — velocity feedforward sent with every command
torque_ff = 0.0   # N·m  — torque feedforward sent with every command
# kp and kd are set per-motor in the robstride_p motor config (not per-command)

[damiao_pv_defaults]
speed = 25.0    # rad/s — max speed during move (acc/dec set via motor registers at startup)

[damiao_mit_defaults]
velocity  = 0.0  # rad/s — velocity feedforward
torque_ff = 0.0  # N·m  — torque feedforward
# kp and kd are set per-motor in the damiao_p motor config

# Transforms applied when target_node = "right_arm" (source = left arm).
# Keys are base motor names (no L/R suffix).
# Function names reference mimic/transforms.py.
[robstride_transform_map]
Sp = "negate"
Sr = "negate"
Sw = "negate"
Ep = "negate"
Ww = "negate"
Wp = "negate"
Wr = "negate"

# Transforms applied when target_node = "left_arm" (source = right arm).
[robstride_inverse_transform_map]
Sp = "negate"
Sr = "negate"
Sw = "negate"
Ep = "negate"
Ww = "negate"
Wp = "negate"
Wr = "negate"

# Damiao gripper transforms when target_node = "right_arm" (left gripper → right gripper).
[damiao_transform_map]
Ag = "passthrough"

# Damiao gripper transforms when target_node = "left_arm" (right gripper → left gripper).
[damiao_inverse_transform_map]
Ag = "passthrough"
