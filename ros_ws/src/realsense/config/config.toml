# realsense — RealSense D405 node config

node_name      = "realsense"
cam_frame_name = "realsense"   # TF frame id used in all message headers

# ── Device ────────────────────────────────────────────────────────────────────
serial = ""           # device serial number; empty = first available device
disconnect_timeout_s = 5.0   # seconds of consecutive timeouts before treating as disconnect

# ── Streams ───────────────────────────────────────────────────────────────────
enable_color = true
enable_depth = true

color_fps   = 30.0
depth_fps   = 30.0

# D405 supported combos: 640×480@30/15/5, 848×480@10/5, 1280×720@color15/depth5
color_width  = 640
color_height = 480
depth_width  = 640
depth_height = 480

# ── Depth limits ──────────────────────────────────────────────────────────────
# D405 operating range: ~0.07 m – 0.5 m
depth_min_m = 0.07
depth_max_m = 0.50

# ── Alignment ─────────────────────────────────────────────────────────────────
align_to_color = true   # align depth frame to colour frame

# ── Colour rectification ──────────────────────────────────────────────────────
enable_color_rectification  = false
color_rectification_alpha   = 0.0    # 0.0 = no black borders, 1.0 = full FOV
color_rectification_crop    = false  # crop rectified image to valid ROI

# Topics publish under /{node_name}/ e.g. /realsense/color/image_raw
