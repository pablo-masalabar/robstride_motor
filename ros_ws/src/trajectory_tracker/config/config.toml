# trajectory_tracker — left arm records, right arm replays

node_name = "trajectory_tracker"

package_path = "/home/neuralpilot/anuj/ros_ws/src/trajectory_tracker"

left_arm_node_prefix  = "/left_arm"
right_arm_node_prefix = "/right_arm"

left_gripper_node_prefix  = "/grippers"
right_gripper_node_prefix = "/grippers"

active_report_hz      = 30.0
trajectory_record_hz  = 30.0
replay_hz             = 30.0

replay_motor_mode = "pp"

# Physical left arm motors (robstride)
left_arm_motors  = ["SpL", "SrL", "SwL", "EpL", "WwL", "WpL", "WrL"]

# Physical right arm motors (robstride)
right_arm_motors = ["SpR", "SrR", "SwR", "EpR", "WwR", "WpR", "WrR"]

# Physical gripper motors (damiao) — recorded and replayed alongside arm motors
left_gripper_motors  = ["AgL"]
right_gripper_motors = ["AgR"]

# Robstride: recording motor → replay motor
[motor_map]
SpL = "SpR"
SrL = "SrR"
SwL = "SwR"
EpL = "EpR"
WwL = "WwR"
WpL = "WpR"
WrL = "WrR"

# Damiao: recording gripper → replay gripper
[damiao_motor_map]
AgL = "AgR"

# Robstride transforms — keys are base names (no L/R suffix)
[transform_map]
Sp = "negate"
Sr = "negate"
Sw = "negate"
Ep = "negate"
Ww = "negate"
Wp = "negate"
Wr = "passthrough"

[inverse_transform_map]
Sp = "negate"
Sr = "negate"
Sw = "negate"
Ep = "negate"
Ww = "negate"
Wp = "negate"
Wr = "passthrough"

# Damiao gripper transforms — keys are base names (no L/R suffix)
[damiao_transform_map]
Ag = "passthrough"

[damiao_inverse_transform_map]
Ag = "passthrough"

[pp_defaults]
speed        = 15.0
acceleration = 10.0
deceleration = 10.0
torque_limit = 25.0

[csp_defaults]
speed_limit   = 15.0
current_limit = 0.0

[damiao_pv_defaults]
speed = 5.0    # rad/s — acc/dec set via motor registers at startup
