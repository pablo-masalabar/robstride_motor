# webxr_teleop — config

node_name = "webxr_teleop"

debug = false   # when true, commands are logged but NOT published to motors

enable_motors_on_startup  = true   # call enable_motors for all motors during setup
forwarding_enabled        = true   # start forwarding zenoh commands to motors immediately

robstride_motor_mode = "pp"
damiao_motor_mode    = "position_velocity"
ezmotion_motor_mode  = "pp"

# Gravity compensation — requires robstride_motor_mode = "operation"
use_jd              = false
left_arm_urdf_path  = "urdf/left_arm/feather_arm_left_8dof.urdf"   # relative to this config file, or absolute
right_arm_urdf_path = "urdf/right_arm/feather_arm_right_8dof.urdf"
left_ee_frame       = "arm_to_gripperL"
right_ee_frame      = "arm_to_gripperR"
# Base motor names (no L/R suffix) — must match joint names in URDF
arm_motors          = ["Sp", "Sr", "Sw", "Ep", "Ww", "Wp", "Wr"]

# robstride_active_report_hz = 30.0   # optional — overrides per-node active report rate
# damiao_active_report_hz    = 50.0   # optional — overrides per-node active report rate
# ezmotion_active_report_hz  = 30.0   # optional — overrides per-node active report rate

joints_state_publish_hz = 30.0   # optional — falls back to active_report_hz if not set
# zenoh_config   = "zenoh_config.json5"   # optional — path to zenoh JSON5 config file

# Feedback keys (ROS → Zenoh)
left_arm_zenoh_key      = "feather/feedback_arm_left"
right_arm_zenoh_key     = "feather/feedback_arm_right"
left_gripper_zenoh_key  = "feather/feedback_gripper_left"
right_gripper_zenoh_key = "feather/feedback_gripper_right"
torso_zenoh_key         = "feather/feedback_torso"
neck_zenoh_key          = "feather/feedback_neck"
chassis_zenoh_key       = "feather/feedback_chassis"

# Command keys (Zenoh → ROS)
left_arm_cmd_zenoh_key      = "feather/joints_cmd/arm_left"
right_arm_cmd_zenoh_key     = "feather/joints_cmd/arm_right"
left_gripper_cmd_zenoh_key  = "feather/cmd/left_gripper"
right_gripper_cmd_zenoh_key = "feather/cmd/right_gripper"
torso_cmd_zenoh_key         = "feather/joints_cmd/torso"
neck_cmd_zenoh_key          = "feather/joints_cmd/neck"
chassis_cmd_zenoh_key       = "feather/joints_cmd/chassis"

# Zenoh motor groups — maps group name to motor list.
# Group names must match the *_zenoh_key / *_cmd_zenoh_key prefixes above.
[zenoh_motor_groups]
left_arm      = ["SpL", "SrL", "SwL", "EpL", "WwL", "WpL", "WrL", "AgL"]
right_arm     = ["SpR", "SrR", "SwR", "EpR", "WwR", "WpR", "WrR", "AgR"]
torso         = ["torso"]
neck          = ["NpC", "NwC"]
chassis       = ["BwC", "BwR", "BwL", "BpC", "BpR", "BpL"]

# --- Left arm (robstride, can0) ---
[left_arm]
active_report_hz            = 30.0
cmd_defaults                = "robstride_pp_defaults"
# enable_disable_service_name = "/left_arm/enable_motor"
cmd_topic_pattern      = "/left_arm/motors/{motor_name}/cmd_position_pp"
feedback_topic_pattern = "/left_arm/motors/{motor_name}/state"

[left_arm.SpL]
motor_type = "robstride"

[left_arm.SrL]
motor_type = "robstride"

[left_arm.SwL]
motor_type = "robstride"

[left_arm.EpL]
motor_type = "robstride"

[left_arm.WwL]
motor_type = "robstride"

[left_arm.WpL]
motor_type = "robstride"

[left_arm.WrL]
motor_type = "robstride"

# --- Right arm (robstride, can2) ---
[right_arm]
active_report_hz            = 30.0
cmd_defaults                = "robstride_pp_defaults"
# enable_disable_service_name = "/right_arm/enable_motor"
cmd_topic_pattern      = "/right_arm/motors/{motor_name}/cmd_position_pp"
feedback_topic_pattern = "/right_arm/motors/{motor_name}/state"

[right_arm.SpR]
motor_type = "robstride"

[right_arm.SrR]
motor_type = "robstride"

[right_arm.SwR]
motor_type = "robstride"

[right_arm.EpR]
motor_type = "robstride"

[right_arm.WwR]
motor_type = "robstride"

[right_arm.WpR]
motor_type = "robstride"

[right_arm.WrR]
motor_type = "robstride"

# --- Base and neck (robstride, can0) ---
[base_and_neck]
active_report_hz            = 30.0
# enable_disable_service_name = "/base_and_neck/enable_motor"
cmd_topic_pattern      = "/base_and_neck/motors/{motor_name}/cmd_position_pp"
feedback_topic_pattern = "/base_and_neck/motors/{motor_name}/state"

# Neck pitch (NpC) calibration — zenoh/URDF range is [-0.52, 1.57] rad.
neck_pitch_low  = -2.1   # hw motor position (rad) corresponding to zenoh -0.52
neck_pitch_high =  0.02  # hw motor position (rad) corresponding to zenoh  1.57

[base_and_neck.BwC]
motor_type = "robstride"
cmd_defaults = "robstride_pp_defaults"

[base_and_neck.BwR]
motor_type = "robstride"
cmd_defaults = "robstride_pp_defaults"

[base_and_neck.BwL]
motor_type = "robstride"
cmd_defaults = "robstride_pp_defaults"

[base_and_neck.BpC]
motor_type        = "robstride"
mode              = "velocity"
cmd_defaults      = "robstride_vel_defaults"
cmd_topic_pattern = "/base_and_neck/motors/{motor_name}/cmd_velocity"

[base_and_neck.BpR]
motor_type        = "robstride"
mode              = "velocity"
cmd_defaults      = "robstride_vel_defaults"
cmd_topic_pattern = "/base_and_neck/motors/{motor_name}/cmd_velocity"

[base_and_neck.BpL]
motor_type        = "robstride"
mode              = "velocity"
cmd_defaults      = "robstride_vel_defaults"
cmd_topic_pattern = "/base_and_neck/motors/{motor_name}/cmd_velocity"

[base_and_neck.NpC]
motor_type = "robstride"
cmd_defaults = "robstride_pp_defaults"

[base_and_neck.NwC]
motor_type = "robstride"
cmd_defaults = "robstride_pp_defaults"

# --- Torso (ezmotion linear actuator) ---
[torso]
active_report_hz            = 30.0
cmd_defaults                = "ezmotion_pp_defaults"
# enable_disable_service_name = "/ezmotion/enable_motor"
cmd_topic_pattern      = "/torso/motors/{motor_name}/go_to"
feedback_topic_pattern = "/torso/motors/{motor_name}/processed_state"

# Motor position (mm) corresponding to URDF torso_lift_joint = 0.0 m (fully extended / home).
# cmd_mm = torso_home_mm + lift_m * 1000;  lift_m = (cmd_mm - torso_home_mm) / 1000
torso_home_mm = 600.0

[torso.torso]
motor_type = "ezmotion"

# --- Grippers (damiao) ---
[grippers]
active_report_hz            = 30.0
cmd_defaults                = "damiao_pv_defaults"
# enable_disable_service_name = "/grippers/enable_motor"
cmd_topic_pattern      = "/grippers/motors/{motor_name}/cmd_position_pv"
feedback_topic_pattern = "/grippers/motors/{motor_name}/state"

# Gripper range — motor positions corresponding to fully contracted and expanded states.
# Zenoh commands arrive as 0.0 (contracted) to 1.0 (expanded) and are scaled to these limits.
# Feedback is scaled back to 0..1 before publishing to Zenoh.
gripper_open_val   =  0.02   # rad — motor position when fully open
gripper_closed_val =  5.0    # rad — motor position when fully closed

[grippers.AgL]
motor_type = "damiao"

[grippers.AgR]
motor_type = "damiao"

[robstride_operation_defaults]
kp = 8.0
kd = 0.0
# torque_ff is always from gravity compensation (use_jd=true) or 0.0 (use_jd=false)

[robstride_pp_defaults]
speed        = 30.0   # rad/s
acceleration = 50.0   # rad/s²
deceleration = 50.0   # rad/s²
torque_limit = 0.0   # N·m

[robstride_vel_defaults]
acceleration  = 20.0   # rad/s²
current_limit = 23.0   # A

[ezmotion_pp_defaults]
speed        = 100.0   # rad/s — profile_velocity written to motor at go_to
acceleration = 100.0   # rad/s²
deceleration = 100.0   # rad/s²

[damiao_pv_defaults]
speed = 25.0    # rad/s — acc/dec set via motor registers at startup

# --- Arm poses (optional) ---
# Named motor-position snapshots sent via the ~/set_arm_pose service.
# Call: ros2 service call ~/set_arm_pose custom_interfaces/srv/EnableMotors "{name: 'home'}"
# Each sub-table key is the pose name; entries are motor_name = position (rad or m).
#

[set_arm_pose_pp_defaults]
speed        = 2.5   # rad/s
acceleration = 5.0   # rad/s²
deceleration = 5.0   # rad/s²
torque_limit = 0.0   # N·m


[arm_poses.home]
cmd_defaults = "set_arm_pose_pp_defaults"
SpL = 0.0
SrL = 0.0
EpL = 0.0
WwL = 0.0
WpL = 0.0
WrL = 0.0
SpR = 0.0
SrR = 0.0
EpR = 0.0
WwR = 0.0
WpR = 0.0
WrR = 0.0
AgL = 2.5
AgR = 2.5

[arm_poses.elbow_up]
cmd_defaults = "set_arm_pose_pp_defaults"
SpL = 0.0
SrL = 0.0
EpL = -1.57
WwL = 0.0
WpL = 0.0
WrL = 0.0
SpR = 0.0
SrR = 0.0
EpR = 1.57
WwR = 0.0
WpR = 0.0
WrR = 0.0
AgR = 2.5
AgL = 2.5