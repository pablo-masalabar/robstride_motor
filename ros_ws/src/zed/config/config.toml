# zed — ZED 2i camera node config

node_name = "zed"

# ── Device ────────────────────────────────────────────────────────────────────
serial = "33647906"    # device serial number; empty = first available device

# ── Streams ───────────────────────────────────────────────────────────────────
enable_color = true
enable_depth = true
enable_imu   = true

# Supported resolutions / max fps:
#   VGA    — 672 × 376   @ 100 fps
#   HD720  — 1280 × 720  @  60 fps
#   HD1080 — 1920 × 1080 @  30 fps
#   HD2K   — 2208 × 1242 @  15 fps
resolution = "HD1080"
fps        = 30

# ── Depth ─────────────────────────────────────────────────────────────────────
# Depth mode: "performance" | "quality" | "ultra" | "neural"
depth_mode        = "ultra"
depth_min_m       = 0.3    # ZED 2i lower limit ~0.2 m
depth_max_m       = 10.0
depth_confidence  = 95     # 0–100; higher = fewer but more accurate points
enable_fill_mode  = false  # fill depth holes via interpolation

# ── Colour rectification ──────────────────────────────────────────────────────
enable_color_rectification  = false
color_rectification_alpha   = 0.0    # 0.0 = no black borders, 1.0 = full FOV
color_rectification_crop    = false  # crop rectified image to valid ROI

# Topics publish under /{node_name}/ e.g. /zed/color/image_raw
